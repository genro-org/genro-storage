services:
  # RustFS - S3-compatible storage (MinIO images were removed from Docker Hub)
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: genro-storage-rustfs
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    command: /data
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SFTP Server
  # No version tags are published for this image; :latest has not moved in over
  # two years, so it is effectively pinned already.
  sftp:
    image: atmoz/sftp:latest
    container_name: genro-storage-sftp
    ports:
      - "2222:22"
    command: testuser:testpass:1001
    volumes:
      - sftp-data:/home/testuser/upload
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Samba/SMB Server
  # Only architecture tags (amd64/aarch64/armhf) are published besides :latest,
  # and pinning one of those would break the other architecture. :latest has not
  # moved in five years.
  samba:
    image: dperson/samba:latest
    container_name: genro-storage-samba
    ports:
      - "139:139"
      - "445:445"
    environment:
      USER: "testuser;testpass"
      SHARE: "share;/share;yes;no;no;testuser"
    volumes:
      - smb-data:/share
    command: '-u "testuser;testpass" -s "share;/share;yes;no;no;testuser" -p'
    healthcheck:
      test: ["CMD-SHELL", "smbclient -L localhost -U testuser%testpass -m SMB3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WebDAV Server
  webdav:
    image: bytemark/webdav:2.4
    container_name: genro-storage-webdav
    ports:
      - "8080:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: testuser
      PASSWORD: testpass
    volumes:
      - webdav-data:/var/lib/dav
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Azurite - Azure Storage Emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    container_name: genro-storage-azurite
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service
      - "10002:10002"  # Table service
    # --skipApiVersionCheck: adlfs tracks the live Azure API version, so a new
    # adlfs release otherwise fails every request against a pinned emulator with
    # "The API version <date> is not supported by Azurite".
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 5s
      timeout: 3s
      retries: 5

  # fake-gcs-server - Google Cloud Storage Emulator
  fake-gcs:
    image: fsouza/fake-gcs-server:1.55.1
    container_name: genro-storage-fake-gcs
    ports:
      - "4443:4443"
    command: >
      -scheme http
      -port 4443
      -public-host localhost:4443
      -external-url http://localhost:4443
    volumes:
      - gcs-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rustfs-data:
    driver: local
  sftp-data:
    driver: local
  smb-data:
    driver: local
  webdav-data:
    driver: local
  azurite-data:
    driver: local
  gcs-data:
    driver: local
