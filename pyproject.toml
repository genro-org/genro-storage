[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genro-storage"
dynamic = ["version"]
description = "Unified storage abstraction for Genropy framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Genropy Team", email = "info@genropy.org"}
]
keywords = ["storage", "filesystem", "s3", "cloud", "genropy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "fsspec>=2023.1.0",
    "PyYAML>=6.0",
    "genro-toolbox>=0.1.0",
    "genro-builders>=0.22.0",
    "genro-bag>=0.20.1",
]

[project.optional-dependencies]
benchmark = [
    "s3fs>=2023.1.0",
    "boto3>=1.26.0",
    "smart-open[s3]>=7.0",
]
s3 = [
    "s3fs>=2023.1.0",
]
gcs = [
    "gcsfs>=2023.1.0",
]
azure = [
    "adlfs>=2023.1.0",
]
http = [
    "aiohttp>=3.8.0",
]
smb = [
    "smbprotocol>=1.10.0",
]
sftp = [
    "paramiko>=3.0.0",
]
webdav = [
    "webdav4>=0.9.0",
]
libarchive = [
    "libarchive-c>=5.0",
]
git = [
    "pygit2>=1.13.0",
]
# fsspec's github filesystem is import-time dependent on requests, which the
# base install does not pull in: without this extra a github mount raises
# ImportError on first use.
github = [
    "requests>=2.31.0",
]
encryption = [
    "cryptography>=42.0.0",
]
all = [
    "s3fs>=2023.1.0",
    "gcsfs>=2023.1.0",
    "adlfs>=2023.1.0",
    "aiohttp>=3.8.0",
    "smbprotocol>=1.10.0",
    "paramiko>=3.0.0",
    "webdav4>=0.9.0",
    "libarchive-c>=5.0",
    "pygit2>=1.13.0",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=1.24",
    "sphinxcontrib-mermaid>=0.9.0",
    "myst-parser>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "boto3>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/genropy/genro-storage"
Documentation = "https://genro-storage.readthedocs.io"
Repository = "https://github.com/genropy/genro-storage"
"Bug Tracker" = "https://github.com/genropy/genro-storage/issues"

[tool.hatch.version]
# Single source of truth: __version__ in the package itself.
path = "src/genro_storage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/genro_storage"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# mypy is a non-blocking advisor here, never a gate: keep it useful for typos,
# unhandled None and broken imports, and off the back of the dynamic patterns
# the codebase relies on. Hence non-strict — no disallow_untyped_defs.
disallow_untyped_defs = false
files = ["src/genro_storage"]

# The grammar declares its elements as decorated method stubs: @element reads
# the signature and the body is empty, so annotating their return type states
# nothing. Silenced for this module rather than annotating 17 stubs.
[[tool.mypy.overrides]]
module = "genro_storage.storage_grammar"
disable_error_code = ["no-untyped-def"]

# A node holds ``_backend = None`` exactly when it is virtual: the methods that
# reach for the backend are unreachable on such a node, an invariant the
# constructor enforces but mypy cannot narrow. The backends themselves are
# fsspec-facing and hand back Any. Both boundaries are accepted, so we silence
# their two error codes for this module rather than littering the code with
# casts. Everything else mypy finds here stays visible.
[[tool.mypy.overrides]]
module = "genro_storage.node"
disable_error_code = ["union-attr", "no-any-return"]

# Thin passthrough over fsspec, which ships no py.typed: every delegated call
# is typed Any at the boundary.
[[tool.mypy.overrides]]
module = "genro_storage.backends.fsspec"
disable_error_code = ["no-any-return"]

# Third-party packages without type stubs (fsspec, boto3, yaml).
[[tool.mypy.overrides]]
module = ["fsspec.*", "boto3.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["async_POC", "doc_to_review", ".git", "__pycache__"]
python_files = ["test_*.py"]
addopts = "-v --cov=genro_storage --cov-report=term-missing"
markers = [
    "integration: Integration tests that require external services (MinIO, SFTP, SMB, WebDAV, etc.)",
    "unit: Fast unit tests with no external dependencies",
]

[tool.coverage.run]
# Record paths relative to the repository: py-cov-action re-runs `coverage json`
# inside its own container, where absolute runner paths do not exist.
relative_files = true
